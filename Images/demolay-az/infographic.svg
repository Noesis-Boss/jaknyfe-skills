<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="1200" height="1700" font-family="Georgia, 'Times New Roman', serif">
  <!-- ============================================================
       ORDER OF DeMOLAY — ARIZONA — Recruitment Infographic
       Color palette: deep crimson + antique gold + cream + slate
       (echoes traditional Masonic / DeMolay heraldry)
       ============================================================ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f1e3"/>
      <stop offset="100%" stop-color="#ede4cc"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a1421"/>
      <stop offset="100%" stop-color="#5a0d18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b48a3c"/>
      <stop offset="50%" stop-color="#d9b563"/>
      <stop offset="100%" stop-color="#b48a3c"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ====== BACKGROUND ====== -->
  <rect width="1200" height="1700" fill="url(#bg)"/>

  <!-- Decorative double border -->
  <rect x="24" y="24" width="1152" height="1652" fill="none" stroke="#7a1421" stroke-width="3"/>
  <rect x="36" y="36" width="1128" height="1628" fill="none" stroke="#b48a3c" stroke-width="1"/>

  <!-- ====== HEADER ====== -->
  <rect x="60" y="60" width="1080" height="280" fill="url(#header)" rx="6"/>
  <rect x="60" y="60" width="1080" height="280" fill="none" stroke="url(#gold)" stroke-width="2" rx="6"/>

  <!-- Heraldic chevron / shield placeholder: simple crossed-swords emblem -->
  <g transform="translate(140,200)">
    <!-- Two crossed swords -->
    <g stroke="#d9b563" stroke-width="6" stroke-linecap="round">
      <line x1="-50" y1="-70" x2="50" y2="70"/>
      <line x1="50" y1="-70" x2="-50" y2="70"/>
      <line x1="-50" y1="-70" x2="-50" y2="-40"/>
      <line x1="50" y1="-70" x2="50" y2="-40"/>
    </g>
    <!-- Center shield -->
    <path d="M 0 -50 L 45 -30 L 45 30 Q 45 60 0 75 Q -45 60 -45 30 L -45 -30 Z"
          fill="#f7f1e3" stroke="#d9b563" stroke-width="3"/>
    <text x="0" y="10" font-size="36" font-weight="bold" text-anchor="middle"
          fill="#7a1421" font-family="Georgia, serif">D</text>
    <text x="0" y="40" font-size="13" text-anchor="middle"
          fill="#7a1421" font-style="italic">Est. 1921</text>
  </g>

  <!-- Headline text block -->
  <text x="240" y="160" font-size="44" font-weight="bold" fill="#f7f1e3">
    Become the Man You're Meant to Be
  </text>
  <text x="240" y="200" font-size="22" fill="#d9b563" font-style="italic">
    Young men 12 – 21 · Arizona
  </text>
  <text x="240" y="245" font-size="28" fill="#f7f1e3" letter-spacing="3">
    ORDER OF DEMOLAY
  </text>
  <text x="240" y="275" font-size="14" fill="#d9b563" letter-spacing="2">
    Leadership · Brotherhood · Character
  </text>

  <!-- ====== WHY JOIN (3 reasons, icon + headline + line) ====== -->
  <text x="600" y="395" font-size="32" font-weight="bold" fill="#7a1421" text-anchor="middle">
    What You Get
  </text>
  <line x1="430" y1="410" x2="770" y2="410" stroke="#b48a3c" stroke-width="2"/>

  <g font-size="18" fill="#2a2a2a">
    <!-- Block 1: Leadership -->
    <circle cx="200" cy="490" r="50" fill="#7a1421"/>
    <text x="200" y="498" font-size="34" fill="#d9b563" text-anchor="middle" font-weight="bold">★</text>
    <text x="290" y="475" font-size="22" font-weight="bold" fill="#7a1421">Lead from day one</text>
    <text x="290" y="500">Run meetings, plan events, manage budgets —</text>
    <text x="290" y="522">leadership experience that colleges</text>
    <text x="290" y="544">and employers actually notice.</text>

    <!-- Block 2: Brotherhood -->
    <circle cx="200" cy="640" r="50" fill="#7a1421"/>
    <text x="200" y="648" font-size="32" fill="#d9b563" text-anchor="middle" font-weight="bold">⚔</text>
    <text x="290" y="625" font-size="22" font-weight="bold" fill="#7a1421">Brotherhood for life</text>
    <text x="290" y="650">Travel to 40+ states. Camp, compete,</text>
    <text x="290" y="672">lead — alongside guys your age who</text>
    <text x="290" y="694">become your people.</text>

    <!-- Block 3: Character -->
    <circle cx="200" cy="790" r="50" fill="#7a1421"/>
    <text x="200" y="798" font-size="32" fill="#d9b563" text-anchor="middle" font-weight="bold">✦</text>
    <text x="290" y="775" font-size="22" font-weight="bold" fill="#7a1421">Build real character</text>
    <text x="290" y="800">Public speaking, civic duty, faith,</text>
    <text x="290" y="822">and the habits that separate</text>
    <text x="290" y="844">good men from great ones.</text>
  </g>

  <!-- Divider -->
  <line x1="120" y1="900" x2="1080" y2="900" stroke="#b48a3c" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ====== SOCIAL PROOF ====== -->
  <text x="600" y="945" font-size="32" font-weight="bold" fill="#7a1421" text-anchor="middle">
    You're in good company
  </text>
  <line x1="450" y1="960" x2="750" y2="960" stroke="#b48a3c" stroke-width="2"/>

  <g font-size="18" fill="#2a2a2a" text-anchor="middle">
    <!-- Stat 1 -->
    <text x="200" y="1040" font-size="56" font-weight="bold" fill="#7a1421">100</text>
    <text x="200" y="1075">years in Arizona</text>
    <text x="200" y="1100" font-size="13" fill="#5a5a5a">(since 1921)</text>

    <!-- Stat 2 -->
    <text x="500" y="1040" font-size="56" font-weight="bold" fill="#7a1421">12+</text>
    <text x="500" y="1075">active chapters</text>
    <text x="500" y="1100" font-size="13" fill="#5a5a5a">across the state</text>

    <!-- Stat 3 -->
    <text x="800" y="1040" font-size="56" font-weight="bold" fill="#7a1421">1,000s</text>
    <text x="800" y="1075">of alumni</text>
    <text x="800" y="1100" font-size="13" fill="#5a5a5a">leading in AZ today</text>

    <!-- Stat 4 -->
    <text x="1080" y="1040" font-size="56" font-weight="bold" fill="#7a1421">$20</text>
    <text x="1080" y="1075">lifetime</text>
    <text x="1080" y="1100" font-size="13" fill="#5a5a5a">membership fee</text>
  </g>

  <!-- Notable alumni strip -->
  <rect x="120" y="1140" width="960" height="100" fill="#fff8e6" stroke="#b48a3c" stroke-width="1.5" rx="4"/>
  <text x="600" y="1175" font-size="16" font-style="italic" fill="#2a2a2a" text-anchor="middle">
    "DeMolay gave me the confidence to lead a team of 40 — at age 17."
  </text>
  <text x="600" y="1205" font-size="14" font-weight="bold" fill="#7a1421" text-anchor="middle">
    — A current Arizona Chapter Master Councilor
  </text>
  <text x="600" y="1228" font-size="11" fill="#5a5a5a" text-anchor="middle" font-style="italic">
    (One of 200+ active members across the state)
  </text>

  <!-- Divider -->
  <line x1="120" y1="1270" x2="1080" y2="1270" stroke="#b48a3c" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ====== FOOT-IN-THE-DOOR CTA ====== -->
  <text x="600" y="1315" font-size="28" font-weight="bold" fill="#7a1421" text-anchor="middle">
    Ready to see what it's about?
  </text>
  <text x="600" y="1350" font-size="16" fill="#2a2a2a" text-anchor="middle">
    No commitment yet. Just show up to one meeting. We think you'll like what you see.
  </text>

  <!-- Two small asks (foot-in-the-door) -->
  <g font-size="15" fill="#2a2a2a">
    <rect x="160" y="1390" width="380" height="80" fill="#fff8e6" stroke="#b48a3c" stroke-width="1.5" rx="4"/>
    <text x="350" y="1418" font-size="20" font-weight="bold" fill="#7a1421" text-anchor="middle">Step 1</text>
    <text x="350" y="1442" text-anchor="middle">Visit one chapter meeting</text>
    <text x="350" y="1462" text-anchor="middle" font-size="13" fill="#5a5a5a">(No pressure, no commitment)</text>

    <rect x="660" y="1390" width="380" height="80" fill="#fff8e6" stroke="#b48a3c" stroke-width="1.5" rx="4"/>
    <text x="850" y="1418" font-size="20" font-weight="bold" fill="#7a1421" text-anchor="middle">Step 2</text>
    <text x="850" y="1442" text-anchor="middle">Ask questions. Meet the guys.</text>
    <text x="850" y="1462" text-anchor="middle" font-size="13" fill="#5a5a5a">(Then decide for yourself)</text>
  </g>

  <!-- ====== FOOTER ====== -->
  <rect x="60" y="1500" width="1080" height="160" fill="#7a1421" rx="4"/>
  <rect x="60" y="1500" width="1080" height="160" fill="none" stroke="url(#gold)" stroke-width="2" rx="4"/>

  <text x="600" y="1545" font-size="22" font-weight="bold" fill="#f7f1e3" text-anchor="middle">
    Ready for Step 1?
  </text>
  <text x="600" y="1578" font-size="20" fill="#d9b563" text-anchor="middle">
    azdemolay.org
  </text>
  <text x="600" y="1608" font-size="14" fill="#f7f1e3" text-anchor="middle">
    Ask a current member · Talk to a parent · Show up once
  </text>
  <text x="600" y="1635" font-size="12" fill="#d9b563" text-anchor="middle" font-style="italic">
    For young men ages 12 – 21 · Arizona
  </text>
</svg>
