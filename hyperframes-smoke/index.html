<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; background: #0b0f19; color: #f5f1e8; font-family: ui-sans-serif, system-ui, sans-serif; }
    .stage { position: absolute; inset: 0; display: grid; place-items: center; }
    .card { padding: 24px 32px; border: 1px solid #d8a657; border-radius: 16px; background: rgba(28,26,22,0.82); }
    h1 { margin: 0 0 8px; font-size: 48px; }
    p { margin: 0; opacity: 0.8; }
  </style>
</head>
<body>
  <div
    data-composition-id="smoke"
    data-width="1280"
    data-height="720"
    data-start="0"
    data-duration="2"
    data-fps="30"
    data-no-timeline
  >
    <div class="stage">
      <div class="card">
        <h1>HyperFrames</h1>
        <p>Smoke test</p>
      </div>
    </div>
  </div>
</body>
</html>
